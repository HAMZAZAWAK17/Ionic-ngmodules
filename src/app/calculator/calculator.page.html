<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="home" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title>Calculatrice Pro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="calculator-container">
    
    <div class="display-section">
      <div class="input-display">
        <div class="number-input">
          <span class="label">Nombre A</span>
          <input type="number" [(ngModel)]="n1" placeholder="0">
        </div>
        <div class="number-input">
          <span class="label">Nombre B</span>
          <input type="number" [(ngModel)]="n2" placeholder="0">
        </div>
      </div>
      
      <div class="result-glass">
        <div class="result-label">RÉSULTAT</div>
        <div class="result-value">{{ result }}</div>
      </div>
    </div>

    <div class="actions-section">
      <div class="operator-grid">
        <button class="op-btn plus" (click)="add()">
          <ion-icon name="add-outline"></ion-icon>
        </button>
        <button class="op-btn minus" (click)="subtract()">
          <ion-icon name="remove-outline"></ion-icon>
        </button>
        <button class="op-btn multiply" (click)="multiply()">
          <ion-icon name="close-outline"></ion-icon>
        </button>
        <button class="op-btn divide" (click)="divide()">
          <span>/</span>
        </button>
      </div>

      <button class="clear-btn" (click)="clear()">
        <ion-icon name="refresh-outline" slot="start"></ion-icon>
        RÉINITIALISER
      </button>
    </div>

  </div>
</ion-content>

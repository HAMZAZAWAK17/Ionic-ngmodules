<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Universal Clipboard</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="clearAll()" color="danger">
        <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="custom-content">
  <div class="clipboard-dashboard">
    <div class="header-section">
      <div class="header-icon-box">
        <ion-icon name="sparkles-outline"></ion-icon>
      </div>
      <h1 class="glow-text">Clipboard Pro</h1>
      <p class="subtitle">Quick copy and paste operations</p>
    </div>

    <!-- COPY SECTION -->
    <div class="operation-card">
      <div class="card-label">
        <ion-icon name="duplicate-outline"></ion-icon>
        <span>Copy to Device</span>
      </div>
      <div class="input-wrap">
        <ion-textarea
          [(ngModel)]="textToCopy"
          placeholder="Enter text to copy..."
          rows="4"
          auto-grow="true"
          class="custom-textarea"
        ></ion-textarea>
      </div>
      <button class="action-btn copy-theme" (click)="copyToClipboard()" [disabled]="!textToCopy">
        <span>Copy Selected Text</span>
        <ion-icon name="copy-outline"></ion-icon>
      </button>
    </div>

    <!-- PASTE SECTION -->
    <div class="operation-card">
      <div class="card-label">
        <ion-icon name="reader-outline"></ion-icon>
        <span>Paste from Device</span>
      </div>
      <div class="input-wrap">
        <ion-textarea
          [(ngModel)]="textFromClipboard"
          placeholder="Content will appear here..."
          rows="4"
          auto-grow="true"
          readonly="true"
          class="custom-textarea"
        ></ion-textarea>
      </div>
      <button class="action-btn paste-theme" (click)="pasteFromClipboard()">
        <span>Paste Clipboard Content</span>
        <ion-icon name="clipboard-outline"></ion-icon>
      </button>
    </div>
  </div>
</ion-content>

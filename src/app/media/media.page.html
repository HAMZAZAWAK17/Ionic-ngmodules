<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Back" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Media Assets</ion-title>
    <ion-buttons slot="end">
      <ion-button color="primary">
        <ion-icon slot="icon-only" name="share-social-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <div class="media-container">
  
    <!-- Audio -->
    <section class="media-section">
      <h2 class="section-title">Module Audio</h2>
      <ion-card class="media-card audio-card">
        <ion-card-header>
          <ion-card-title>Sample Audio Stream</ion-card-title>
        </ion-card-header>
        <audio controls class="full-width">
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
          Votre navigateur ne supporte pas l'élément audio.
        </audio>
      </ion-card>
    </section>

    <!-- Vidéo -->
    <section class="media-section">
      <h2 class="section-title">Lecteur Vidéo</h2>
      <ion-card class="media-card video-card">
        <video controls class="full-width" poster="https://peach.blender.org/wp-content/uploads/title_an_full.jpg">
          <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
          Votre navigateur ne supporte pas l'élément vidéo.
        </video>
        <ion-card-header>
          <ion-card-title>Big Buck Bunny</ion-card-title>
        </ion-card-header>
      </ion-card>
    </section>

  </div>
</ion-content>

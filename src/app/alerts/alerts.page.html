<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="primary"></ion-back-button>
    </ion-buttons>
    <ion-title>Alerts & Feedbacks</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="alerts-wrapper">
    <div class="intro">
      <h1>System Alerts</h1>
      <p>Test various native notifications and feedback modules.</p>
    </div>

    <div class="alert-grid">
      <!-- Info Alert -->
      <ion-card class="alert-card info" (click)="presentSimpleAlert()">
        <div class="card-icon">
          <ion-icon name="information-circle-outline"></ion-icon>
        </div>
        <div class="card-content">
          <h3>Info Alert</h3>
          <p>Simple feedback notice</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="go"></ion-icon>
      </ion-card>

      <!-- Confirmation -->
      <ion-card class="alert-card warning" (click)="presentConfirmAlert()">
        <div class="card-icon">
          <ion-icon name="warning-outline"></ion-icon>
        </div>
        <div class="card-content">
          <h3>Confirmation</h3>
          <p>Destructive action dialog</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="go"></ion-icon>
      </ion-card>

      <!-- Input -->
      <ion-card class="alert-card primary" (click)="presentInputAlert()">
        <div class="card-icon">
          <ion-icon name="create-outline"></ion-icon>
        </div>
        <div class="card-content">
          <h3>Input Alert</h3>
          <p>Quick form interaction</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="go"></ion-icon>
      </ion-card>

      <!-- Selection -->
      <ion-card class="alert-card secondary" (click)="presentRadioAlert()">
        <div class="card-icon">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
        </div>
        <div class="card-content">
          <h3>Radio List</h3>
          <p>Multiple choice selection</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="go"></ion-icon>
      </ion-card>

      <!-- Action Sheet -->
      <ion-card class="alert-card sheet" (click)="presentActionSheet()">
        <div class="card-icon">
          <ion-icon name="alert-circle-outline"></ion-icon>
        </div>
        <div class="card-content">
          <h3>Action Sheet</h3>
          <p>Contextual menu options</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="go"></ion-icon>
      </ion-card>
    </div>
  </div>
</ion-content>

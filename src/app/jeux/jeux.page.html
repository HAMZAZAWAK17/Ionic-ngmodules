<ion-header class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Game Center</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="recommencer()" color="light">
        <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="custom-content">
  <div class="game-dashboard">
    <div class="header-section">
      <div class="header-icon-box">
        <ion-icon name="game-controller-outline"></ion-icon>
      </div>
      <h1 class="glow-text">Number Guesser</h1>
      <p class="subtitle">Find the secret integer between 0 and 100</p>
    </div>

    <!-- MAIN GAME BOARD -->
    <div class="game-card">
      
      <!-- Stats / Tries left -->
      <div class="stats-row">
        <div class="stat-box status" [ngClass]="{'win': gagne, 'lose': jeuTermine && !gagne}">
          <ion-icon [name]="gagne ? 'trophy-outline' : (jeuTermine ? 'skull-outline' : 'pulse-outline')"></ion-icon>
          <span class="status-message">{{ message || 'Awaiting input...' }}</span>
        </div>

        <div class="stat-box">
          <ion-icon name="heart" [class.danger]="tentatives <= 1"></ion-icon>
          <span class="stat-value">{{ tentatives }}</span>
          <span class="stat-label">Tries Left</span>
        </div>
      </div>

      <div class="input-group">
        <div class="field-label">Your Guess</div>
        <div class="field-container">
          <ion-icon name="keypad-outline" class="field-icon"></ion-icon>
          <ion-input type="number" 
                    [(ngModel)]="nombreSaisi" 
                    placeholder="Enter a number..."
                    [disabled]="jeuTermine"
                    class="custom-input">
          </ion-input>
        </div>
      </div>

      <button class="verify-btn" (click)="verifierNombre()" [disabled]="nombreSaisi === null || jeuTermine">
        <span>Verify Guess</span>
        <ion-icon name="checkmark-circle-outline"></ion-icon>
      </button>

      <!-- REPLAY OPTION displayed if game over -->
      <button class="replay-btn" *ngIf="jeuTermine" (click)="initialiserJeu()">
        <span>Play Again</span>
        <ion-icon name="refresh-circle-outline"></ion-icon>
      </button>
    </div>
  </div>
</ion-content>

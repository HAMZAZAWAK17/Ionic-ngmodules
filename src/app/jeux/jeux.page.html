<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Back" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Logic Module</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="recommencer()">
        <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <div class="pro-game-wrapper ion-padding">
    
    <div class="module-header">
      <div class="module-icon">
        <ion-icon name="extension-puzzle-outline"></ion-icon>
      </div>
      <div class="module-text">
        <h1>Number Logic Game</h1>
        <p>Attempt to identify the randomly generated system integer between 1 and 100.</p>
      </div>
    </div>

    <!-- MAIN GAME BOARD -->
    <div class="logic-board">
      <div class="status-row">
        <div class="badge" [ngClass]="{'success': message.includes('Bravo'), 'danger': message.includes('plus'), 'waiting': !message}">
          {{ message || 'Awaiting input...' }}
        </div>
      </div>

      <div class="input-section">
        <label>System Input</label>
        <div class="custom-input-box">
          <ion-input type="number" 
                    [(ngModel)]="nombreSaisi" 
                    placeholder="Enter integer..."
                    mode="md">
          </ion-input>
          <ion-button (click)="verifierNombre()" [disabled]="nombreSaisi === null">
            Verify Logic
          </ion-button>
        </div>
      </div>

      <!-- REPLAY OPTION displayed if game over -->
      <div class="replay-overlay" *ngIf="message.includes('Bravo')">
        <ion-button expand="block" 
                    class="ion-margin-top"
                    (click)="initialiserJeu()">
          Rejouer
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>

<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="primary"></ion-back-button>
    </ion-buttons>
    <ion-title>SMS Composer</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="sms-wrapper">
    
    <div class="page-intro">
      <h1>New Message</h1>
      <p>Send a pre-filled direct message to any contact.</p>
    </div>

    <ion-card class="composer-card">
      <div class="input-section">
        <ion-item lines="full" class="num-item">
          <ion-icon name="phone-portrait-outline" slot="start" color="primary"></ion-icon>
          <ion-label position="floating">Receiver Number</ion-label>
          <ion-input type="tel" placeholder="+212 600..." [(ngModel)]="phoneNumber"></ion-input>
        </ion-item>

        <ion-item lines="none" class="msg-item">
          <ion-label position="stacked">Your Message</ion-label>
          <ion-textarea 
            placeholder="Type your message here..." 
            [(ngModel)]="messageText"
            rows="6"
            auto-grow="true">
          </ion-textarea>
        </ion-item>
      </div>

      <div class="action-footer">
        <ion-button expand="block" (click)="sendSms()" [disabled]="!phoneNumber || !messageText" shape="round">
          <ion-icon slot="start" name="paper-plane-outline"></ion-icon>
          Launch SMS App
        </ion-button>
      </div>
    </ion-card>

    <div class="helper-text">
      <p>This action will open the native SMS manager on your mobile device.</p>
    </div>

  </div>
</ion-content>

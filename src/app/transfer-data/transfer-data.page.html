<ion-header class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Data Sync</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="custom-content">
  <div class="transfer-dashboard">
    <div class="header-section">
      <div class="header-icon-box">
        <ion-icon name="sync-outline"></ion-icon>
      </div>
      <h1 class="glow-text">Sync Module</h1>
      <p class="subtitle">Propagate system data across the application</p>
    </div>

    <div class="sync-container">
      <div class="input-group">
        <div class="field-label">Identity String</div>
        <div class="field-container">
          <ion-icon name="person-outline" class="field-icon"></ion-icon>
          <ion-input type="text" [(ngModel)]="nom" placeholder="Enter name identifier..." class="custom-input"></ion-input>
        </div>
      </div>

      <div class="input-group">
        <div class="field-label">System Email</div>
        <div class="field-container">
          <ion-icon name="mail-outline" class="field-icon"></ion-icon>
          <ion-input type="email" [(ngModel)]="email" placeholder="Enter contact email..." class="custom-input"></ion-input>
        </div>
      </div>

      <button class="sync-btn" (click)="valider()" [disabled]="!nom || !email">
        <span>Execute Synchronization</span>
        <ion-icon name="swap-horizontal-outline"></ion-icon>
      </button>

      <div class="info-alert">
        <ion-icon name="information-circle-outline"></ion-icon>
        <p>Changes will propagate to the summary dashboard immediately after execution.</p>
      </div>
    </div>
  </div>
</ion-content>

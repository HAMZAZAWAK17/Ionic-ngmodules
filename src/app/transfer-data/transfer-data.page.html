<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goHome()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>TRANSFER DATA</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-text-center">
  <div class="container">
    <div class="icon-header">
      <ion-icon name="swap-horizontal-outline" color="primary"></ion-icon>
    </div>
    
    <h2 class="title">Données Transférées</h2>
    <p class="subtitle">Informations reçues de la page d'accueil</p>

    <div class="data-card" *ngIf="data">
      <div class="data-item">
        <label>MESSAGE</label>
        <h3>{{ data.msg }}</h3>
      </div>
      <div class="divider"></div>
      <div class="data-item">
        <label>IDENTIFIANT</label>
        <h3>{{ data.name }}</h3>
      </div>
    </div>
  </div>
</ion-content>

<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Back" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Data Management</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  
  <div class="transfer-container">
    
    <div class="transfer-card">
      <div class="card-header-pro">
        <h2>Sync Module</h2>
        <p>Input system data for cross-module synchronization.</p>
      </div>

      <div class="form-group">
        <label>Identity String</label>
        <div class="custom-input">
          <ion-input type="text" [(ngModel)]="nom" placeholder="Enter name identifier..."></ion-input>
        </div>
      </div>

      <div class="form-group">
        <label>System Email</label>
        <div class="custom-input">
          <ion-input type="email" [(ngModel)]="email" placeholder="Enter contact email..."></ion-input>
        </div>
      </div>

      <ion-button expand="block" (click)="valider()" class="submit-btn">
        Execute Synchronization
      </ion-button>

      <div class="info-hint">
        <ion-icon name="information-circle-outline"></ion-icon>
        <span>Changes will propagate to the summary dashboard immediately.</span>
      </div>
    </div>

  </div>

</ion-content>
